<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penguin Species Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Penguin Species Predictor</h1>
        <form action="/predict" method="POST">
            <div class="form-group">
                <input type="number" step="any" name="bill_length" placeholder="Bill Length (mm)" required>
            </div>
            <div class="form-group">
                <input type="number" step="any" name="bill_depth" placeholder="Bill Depth (mm)" required>
            </div>
            <div class="form-group">
                <input type="number" step="any" name="flipper_length" placeholder="Flipper Length (mm)" required>
            </div>
            <div class="form-group">
                <input type="number" step="any" name="body_mass" placeholder="Body Mass (g)" required>
            </div>
            <div class="form-group">
                <input type="number" step="any" name="sex" placeholder="Sex (0 for male, 1 for female)" required>
            </div>
            <div class="form-group">
                <input type="number" step="any" name="island" placeholder="Island (0, 1, or 2)" required>
            </div>
            <button type="submit">Predict Species</button>
        </form>
        <div class="result">
            {{ prediction_text }}
        </div>
    </div>
</body>
</html>
